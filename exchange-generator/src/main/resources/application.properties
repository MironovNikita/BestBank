server.port=8088
spring.application.name=exchange-generator

#Keycloak (OAuth2)
spring.security.oauth2.client.provider.keycloak.issuer-uri=${SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER:http://localhost:8080/realms/bank-app}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT:http://localhost:8080/realms/bank-app/protocol/openid-connect/certs}

# --- ExchangeService ---
spring.security.oauth2.client.registration.exchange-service.client-id=exchange-generator
spring.security.oauth2.client.registration.exchange-service.client-secret=${SPRING_SECURITY_OAUTH2_SECRET:ls7aUcNo4FTeGuEGl5IQauxzpPMScgYc}
spring.security.oauth2.client.registration.exchange-service.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.exchange-service.scope=openid
spring.security.oauth2.client.registration.exchange-service.provider=keycloak

#Resilience4j
# --- ExchangeService ---
resilience4j.retry.instances.exchangeServiceRetry.maxAttempts=3
resilience4j.retry.instances.exchangeServiceRetry.wait-duration.seconds=2
resilience4j.retry.instances.exchangeServiceRetry.retryExceptions=org.springframework.web.reactive.function.client.WebClientRequestException
resilience4j.circuitBreaker.instances.exchangeServiceCB.registerHealthIndicator=true
resilience4j.circuitBreaker.instances.exchangeServiceCB.slidingWindowSize=10
resilience4j.circuitBreaker.instances.exchangeServiceCB.failureRateThreshold=50
resilience4j.circuitBreaker.instances.exchangeServiceCB.waitDurationInOpenState=5s

#Kafka-Producer
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.topic.exchange=actual-rates
spring.kafka.topic.exchange.key=exchange-rates
spring.kafka.template.observation-enabled=true

#Actuator & Metrics
management.endpoints.web.exposure.include=health,info,loggers,refresh,metrics,prometheus,traces
management.endpoint.health.show-details=always

management.tracing.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:1.0}
management.zipkin.tracing.endpoint=${ZIPKIN_BASE_URL:http://localhost:9411}/api/v2/spans
management.tracing.propagation.type=b3

#Prometheus
management.prometheus.metrics.export.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.http.server.errors=true
management.metrics.distribution.percentiles-histogram.http.client.requests=true
management.metrics.enable.kafka=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.service=exchange-generator

#Logs
logging.pattern.console=%d{yyyy-MM-dd - HH:mm:ss.SSS (XXX)} %highlight(%5p) %clr(${PID}){magenta} ---> [%X{traceId:-}/%X{spanId:-}] [%clr(%t){green}] %clr(%c{36}){cyan} : %m%n
spring.output.ansi.enabled=always
logging.level.com.bank=INFO
logging.level.web=INFO
logging.level.org.springframework.web.reactive=INFO
logging.level.kafka=INFO
logging.level.root=INFO