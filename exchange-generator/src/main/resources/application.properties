server.port=8088
spring.application.name=exchange-generator

#Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

#Keycloak (OAuth2)
spring.security.oauth2.client.provider.keycloak.issuer-uri=${SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER:http://localhost:8080/realms/bank-app}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT:http://localhost:8080/realms/bank-app/protocol/openid-connect/certs}

# --- ExchangeService ---
spring.security.oauth2.client.registration.exchange-service.client-id=exchange-generator
spring.security.oauth2.client.registration.exchange-service.client-secret=${SPRING_SECURITY_OAUTH2_SECRET:ls7aUcNo4FTeGuEGl5IQauxzpPMScgYc}
spring.security.oauth2.client.registration.exchange-service.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.exchange-service.scope=openid
spring.security.oauth2.client.registration.exchange-service.provider=keycloak

#Logs
logging.pattern.console=%d{yyyy-MM-dd - HH:mm:ss.SSS (XXX)} %highlight(%5p) %clr(${PID}){magenta} ---> [%clr(%t){green}] %clr(%c{36}){cyan} : %m%n
spring.output.ansi.enabled=always

#Resilience4j
# --- ExchangeService ---
resilience4j.retry.instances.exchangeServiceRetry.maxAttempts=3
resilience4j.retry.instances.exchangeServiceRetry.wait-duration.seconds=2
resilience4j.retry.instances.exchangeServiceRetry.retryExceptions=org.springframework.web.reactive.function.client.WebClientRequestException
resilience4j.circuitBreaker.instances.exchangeServiceCB.registerHealthIndicator=true
resilience4j.circuitBreaker.instances.exchangeServiceCB.slidingWindowSize=10
resilience4j.circuitBreaker.instances.exchangeServiceCB.failureRateThreshold=50
resilience4j.circuitBreaker.instances.exchangeServiceCB.waitDurationInOpenState=5s