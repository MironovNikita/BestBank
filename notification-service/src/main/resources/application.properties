server.port=8084
spring.application.name=notification-service

#Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

#Email settings
spring.mail.host=smtp.yandex.ru
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:bestbank2025@yandex.ru}
spring.mail.password=${SPRING_MAIL_PASSWORD:yczxsbvwwsyrfvlf}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

#Keycloak (OAuth2)
spring.security.oauth2.client.provider.keycloak.issuer-uri=${SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER:http://localhost:8080/realms/bank-app}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT:http://localhost:8080/realms/bank-app/protocol/openid-connect/certs}

#Logs
logging.pattern.console=%d{yyyy-MM-dd - HH:mm:ss.SSS (XXX)} %highlight(%5p) %clr(${PID}){magenta} ---> [%clr(%t){green}] %clr(%c{36}){cyan} : %m%n
spring.output.ansi.enabled=always

logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.reactive=INFO