server.port=8083
spring.application.name=cash-service

#WebClient
services.accounts.base-url=${ACCOUNTS_SERVICE_URL:http://localhost:8081}
services.blocker.base-url=${BLOCKER_SERVICE_URL:http://localhost:8086}

#Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/liquibase/db.changelog-master.xml
spring.liquibase.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:CashDB}
spring.liquibase.user=${SPRING_DATASOURCE_USER:postgres}
spring.liquibase.password=${SPRING_DATASOURCE_PASSWORD:Nikita1995}

#Database
spring.r2dbc.url=r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:CashDB}
spring.r2dbc.username=${SPRING_DATASOURCE_USER:postgres}
spring.r2dbc.password=${SPRING_DATASOURCE_PASSWORD:Nikita1995}
spring.sql.init.mode=always

#Keycloak (OAuth2)
spring.security.oauth2.client.provider.keycloak.issuer-uri=${SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER:http://localhost:8080/realms/bank-app}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT:http://localhost:8080/realms/bank-app/protocol/openid-connect/certs}

# --- AccountsService ---
spring.security.oauth2.client.registration.accounts-service.client-id=cash-service
spring.security.oauth2.client.registration.accounts-service.client-secret=${SPRING_SECURITY_OAUTH2_SECRET:TcGDpj5RCoNZSwPEzbHIA4KlshZXzxyM}
spring.security.oauth2.client.registration.accounts-service.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.accounts-service.scope=openid
spring.security.oauth2.client.registration.accounts-service.provider=keycloak

# --- FrontUI ---
spring.security.oauth2.client.registration.front-ui.client-id=cash-service
spring.security.oauth2.client.registration.front-ui.client-secret=${SPRING_SECURITY_OAUTH2_SECRET:TcGDpj5RCoNZSwPEzbHIA4KlshZXzxyM}
spring.security.oauth2.client.registration.front-ui.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.front-ui.scope=openid
spring.security.oauth2.client.registration.front-ui.provider=keycloak

# --- NotificationsService ---
spring.security.oauth2.client.registration.notifications-service.client-id=cash-service
spring.security.oauth2.client.registration.notifications-service.client-secret=${SPRING_SECURITY_OAUTH2_SECRET:TcGDpj5RCoNZSwPEzbHIA4KlshZXzxyM}
spring.security.oauth2.client.registration.notifications-service.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.notifications-service.scope=openid
spring.security.oauth2.client.registration.notifications-service.provider=keycloak

# --- BlockerService ---
spring.security.oauth2.client.registration.blocker-service.client-id=cash-service
spring.security.oauth2.client.registration.blocker-service.client-secret=${SPRING_SECURITY_OAUTH2_SECRET:TcGDpj5RCoNZSwPEzbHIA4KlshZXzxyM}
spring.security.oauth2.client.registration.blocker-service.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.blocker-service.scope=openid
spring.security.oauth2.client.registration.blocker-service.provider=keycloak

#Resilience4j
# --- AccountsService ---
resilience4j.retry.instances.accountsServiceRetry.maxAttempts=3
resilience4j.retry.instances.accountsServiceRetry.wait-duration.seconds=2
resilience4j.retry.instances.accountsServiceRetry.retryExceptions=org.springframework.web.reactive.function.client.WebClientRequestException
resilience4j.circuitBreaker.instances.accountsServiceCB.registerHealthIndicator=true
resilience4j.circuitBreaker.instances.accountsServiceCB.slidingWindowSize=10
resilience4j.circuitBreaker.instances.accountsServiceCB.failureRateThreshold=50
resilience4j.circuitBreaker.instances.accountsServiceCB.waitDurationInOpenState=5s

# --- NotificationsService ---
resilience4j.retry.instances.notificationsServiceRetry.maxAttempts=3
resilience4j.retry.instances.notificationsServiceRetry.wait-duration.seconds=2
resilience4j.retry.instances.notificationsServiceRetry.retryExceptions=org.springframework.web.reactive.function.client.WebClientRequestException
resilience4j.circuitBreaker.instances.notificationsServiceCB.registerHealthIndicator=true
resilience4j.circuitBreaker.instances.notificationsServiceCB.slidingWindowSize=10
resilience4j.circuitBreaker.instances.notificationsServiceCB.failureRateThreshold=50
resilience4j.circuitBreaker.instances.notificationsServiceCB.waitDurationInOpenState=5s

# --- BlockerService ---
resilience4j.retry.instances.blockerServiceRetry.maxAttempts=3
resilience4j.retry.instances.blockerServiceRetry.wait-duration.seconds=2
resilience4j.retry.instances.blockerServiceRetry.retryExceptions=org.springframework.web.reactive.function.client.WebClientRequestException
resilience4j.circuitBreaker.instances.blockerServiceCB.registerHealthIndicator=true
resilience4j.circuitBreaker.instances.blockerServiceCB.slidingWindowSize=10
resilience4j.circuitBreaker.instances.blockerServiceCB.failureRateThreshold=50
resilience4j.circuitBreaker.instances.blockerServiceCB.waitDurationInOpenState=5s

#Kafka-Producer
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.topic.notification=cash-notifications
spring.kafka.template.observation-enabled=true

#Actuator & Metrics
management.endpoints.web.exposure.include=health,info,loggers,refresh,metrics,prometheus,traces
management.endpoint.health.show-details=always

management.tracing.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:1.0}
management.zipkin.tracing.endpoint=${ZIPKIN_BASE_URL:http://localhost:9411}/api/v2/spans
management.tracing.propagation.type=b3

#Prometheus
management.prometheus.metrics.export.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.http.server.errors=true
management.metrics.distribution.percentiles-histogram.http.client.requests=true
management.metrics.distribution.percentiles-histogram.r2dbc.pool.acquire=true
management.metrics.distribution.percentiles-histogram.r2dbc.pool.create=true
management.metrics.enable.kafka=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.service=cash-service

#Logs
logging.pattern.console=%d{yyyy-MM-dd - HH:mm:ss.SSS (XXX)} %highlight(%5p) %clr(${PID}){magenta} ---> [%X{traceId:-}/%X{spanId:-}] [%clr(%t){green}] %clr(%c{36}){cyan} : %m%n
spring.output.ansi.enabled=always
logging.level.com.bank=INFO
logging.level.web=INFO
logging.level.org.springframework.web.reactive=INFO
logging.level.kafka=INFO
logging.level.root=INFO