#File for local Prometheus run
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "accounts-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: [ "host.docker.internal:8081" ]
        labels:
          application: "accounts-service"

  - job_name: "transfers-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: [ "host.docker.internal:8082" ]
        labels:
          application: "transfers-service"

  - job_name: "cash-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: [ "host.docker.internal:8083" ]
        labels:
          application: "cash-service"

  - job_name: "notification-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: [ "host.docker.internal:8084" ]
        labels:
          application: "notification-service"

  - job_name: "front-ui"
    metrics_path: "/best-bank/actuator/prometheus"
    static_configs:
      - targets: [ "host.docker.internal:8085" ]
        labels:
          application: "front-ui"

  - job_name: "blocker-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: [ "host.docker.internal:8086" ]
        labels:
          application: "blocker-service"

  - job_name: "exchange-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: [ "host.docker.internal:8087" ]
        labels:
          application: "exchange-service"

  - job_name: "exchange-generator"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: [ "host.docker.internal:8088" ]
        labels:
          application: "exchange-generator"