#File for local Prometheus run
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "bestbank-app-front-ui"
    metrics_path: "/best-bank/actuator/prometheus"
    static_configs:
      - targets: [ "host.docker.internal:8085" ]

  - job_name: "bestbank-app"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: [ "host.docker.internal:8081", "host.docker.internal:8082", "host.docker.internal:8083", "host.docker.internal:8084", "host.docker.internal:8086", "host.docker.internal:8087", "host.docker.internal:8088" ]