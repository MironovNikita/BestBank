# -----------------------------
# Keycloak
# -----------------------------
keycloak:
  image:
    repository: quay.io/keycloak/keycloak
    tag: "26.1.3"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

  env:
    KEYCLOAK_ADMIN: admin
    KEYCLOAK_ADMIN_PASSWORD: admin

  command:
    - start-dev
    - --import-realm
    - -Dkeycloak.import.strategy=OVERWRITE_EXISTING

