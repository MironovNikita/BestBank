# -----------------------------
# Kafka
# -----------------------------
kafka:
  enabled: true

  kafka:
    replicaCount: 1

    persistence:
      enabled: true
      size: 1Gi

    kraft:
      clusterId: "hPdNttqdQHCc6FTHW1NV_Q"
      nodeId: 1
      processRoles: "broker,controller"

    config:
      numPartitions: 3
      defaultReplicationFactor: 1
      minInsyncReplicas: 1
      logRetentionHours: 72

  kafkaUi:
    enabled: true

# -----------------------------
# Zipkin
# -----------------------------
zipkin:
  image:
    repository: openzipkin/zipkin
    tag: "3.5.0"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 9411
    targetPort: 9411

  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

  replicaCount: 1

  storage:
    type: mem

# -----------------------------
# Prometheus
# -----------------------------
prometheus:
  image:
    repository: prom/prometheus
    tag: "3.9.1"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 9090
    targetPort: 9090

  storage:
    enabled: true
    size: 5Gi
    storageClassName: "hostpath"

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  retention: "15d"

# -----------------------------
# Grafana
# -----------------------------
grafana:
  image:
    repository: grafana/grafana
    tag: "12.3.1"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000

  adminUser: admin
  adminPassword: admin

  datasources:
    prometheus:
      name: Prometheus
      type: prometheus
      url: http://prometheus:9090
      access: proxy
      isDefault: true

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# -----------------------------
# Elasticsearch
# -----------------------------
elasticsearch:
  image:
    repository: docker.elastic.co/elasticsearch/elasticsearch
    tag: "9.2.4"
    pullPolicy: IfNotPresent

  replicaCount: 1

  service:
    type: ClusterIP
    port: 9200
    transportPort: 9300

  resources:
    requests:
      memory: 1Gi
      cpu: 500m
    limits:
      memory: 2Gi
      cpu: 1000m

  persistence:
    size: 5Gi
    storageClassName: "hostpath"

  elasticsearch:
    javaOpts: "-Xms512m -Xmx512m"
    security:
      enabled: false
      enrollment: false

# -----------------------------
# Logstash
# -----------------------------
logstash:
  image:
    repository: docker.elastic.co/logstash/logstash
    tag: "9.2.4"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 5000
    beatsPort: 5044

  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 500m

  logstash:
    javaOpts: "-Xmx512m -Xms512m"

  kafka:
    bootstrapServers: "kafka:9092"

  elasticsearch:
    host: "elasticsearch"
    port: 9200

# -----------------------------
# Kibana
# -----------------------------
kibana:
  image:
    repository: docker.elastic.co/kibana/kibana
    tag: "9.2.4"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 5601

  replicaCount: 1

  elasticsearch:
    host: "elasticsearch"
    port: 9200

  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 500m

  kibana:
    server:
      name: "kibana"
      host: "0.0.0.0"
    elasticsearch:
      host: "http://elasticsearch:9200"
    security:
      enabled: false
      encryption:
        key:
          value: "min-32-byte-long-strong-encryption-key-value"