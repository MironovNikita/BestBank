apiVersion: v1
kind: Secret
metadata:
  name: notification-service-secret
type: Opaque
stringData:
  SPRING_SECURITY_OAUTH2_SECRET: "{{ .Values.env.SPRING_SECURITY_OAUTH2_SECRET }}"
  SPRING_MAIL_USERNAME: "{{ .Values.env.SPRING_MAIL_USERNAME }}"
  SPRING_MAIL_PASSWORD: "{{ .Values.env.SPRING_MAIL_PASSWORD }}"