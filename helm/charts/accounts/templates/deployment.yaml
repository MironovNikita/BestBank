apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      initContainers:
        - name: wait-for-keycloak
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Keycloak..."
              until nc -zv keycloak 8080; do
                echo "Keycloak not ready yet..."
                sleep 5
              done
              echo "Keycloak is up!"
      containers:
        - name: accounts-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          envFrom:
            - configMapRef:
                name: accounts-service-config
            - secretRef:
                name: accounts-service-secret
          env:
            #База данных
            - name: SPRING_R2DBC_DATASOURCE_URL
              value: "r2dbc:postgresql://{{ .Values.env.DB_HOST }}:{{ .Values.env.DB_PORT }}/{{ .Values.env.DB_NAME }}"

            - name: SPRING_LIQUIBASE_DATASOURCE_URL
              value: "jdbc:postgresql://{{ .Values.env.DB_HOST }}:{{ .Values.env.DB_PORT }}/{{ .Values.env.DB_NAME }}"

            - name: DB_HOST
              value: "{{ .Values.env.DB_HOST }}"

            - name: DB_PORT
              value: "{{ .Values.env.DB_PORT }}"

            - name: DB_NAME
              value: "{{ .Values.env.DB_NAME }}"
