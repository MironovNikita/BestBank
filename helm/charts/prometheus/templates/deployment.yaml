apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: prometheus
    release: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: prometheus
        release: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Chart.Name }}
      containers:
        - name: prometheus
          image: "{{ .Values.prometheus.image.repository }}:{{ .Values.prometheus.image.tag }}"
          imagePullPolicy: {{ .Values.prometheus.image.pullPolicy }}

          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time={{ .Values.prometheus.retention }}"
            - "--web.enable-lifecycle"

          ports:
            - name: http
              containerPort: {{ .Values.prometheus.service.targetPort }}

          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: storage
              mountPath: /prometheus

          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}

      volumes:
        - name: config
          configMap:
            name: {{ .Chart.Name }}-prometheus-config

        - name: storage
          {{- if .Values.prometheus.storage.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Chart.Name }}-prometheus-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}