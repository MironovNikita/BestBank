apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: elasticsearch
    release: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: elasticsearch
        release: {{ .Release.Name }}
    spec:
      volumes:
        - name: elasticsearch-data
          persistentVolumeClaim:
            claimName: {{ .Chart.Name }}-elasticsearch-pvc
      initContainers:
        - name: sysctl
          image: busybox
          securityContext:
            privileged: true
          command: ["sh", "-c", "sysctl -w vm.max_map_count=262144"]
      containers:
        - name: elasticsearch
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 9200
              protocol: TCP
            - name: transport
              containerPort: 9300
              protocol: TCP
          env:
            - name: discovery.type
              value: "single-node"
            - name: ES_JAVA_OPTS
              value: {{ .Values.elasticsearch.javaOpts | quote }}
            - name: xpack.security.enabled
              value: {{ .Values.elasticsearch.security.enabled | quote }}
            - name: xpack.security.enrollment.enabled
              value: {{ .Values.elasticsearch.security.enrollment | quote }}
          volumeMounts:
            - name: elasticsearch-data
              mountPath: /usr/share/elasticsearch/data
          resources:
            {{- toYaml .Values.resources | nindent 12}}