apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-grafana-dashboard-provider
  labels:
    app: grafana
    release: {{ .Release.Name }}
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: BestBank
        orgId: 1
        folder: BestBank
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards